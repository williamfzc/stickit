name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Frontmatter validation is real only with PyYAML present.
      - run: pip install pyyaml

      # Same suite a local change must pass: docs, vet, tests, gofmt.
      - run: scripts/run_checks.sh
