name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Prebuilt assets follow the naming install.sh probes:
      # stickit-<os>-<arch>.tar.gz, binary at the archive root.
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" -o "dist/stickit" .
            tar -czf "dist/stickit-${os}-${arch}.tar.gz" -C dist stickit
            rm dist/stickit
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create the release
        # workflow_dispatch runs on a branch; only a v* tag publishes.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/stickit-*.tar.gz dist/SHA256SUMS.txt
